<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .cyan { fill: #00AEEF; }
      .magenta { fill: #EC008C; }
      .yellow { fill: #FFF200; }
      .black { fill: #111827; }
    </style>
  </defs>
  
  <!-- CMYK Speed Circle Icon -->
  <g transform="translate(10, 10)">
    <!-- Cyan Stripe (Top) -->
    <path class="cyan" d="M 120,20 C 72,20 32,50 20,90 L 220,90 C 215,70 205,55 190,42 C 172,28 148,20 120,20 Z" />
    <rect class="cyan" x="200" y="24" width="40" height="12" rx="6" />
    <rect class="cyan" x="215" y="44" width="35" height="12" rx="6" />
    <rect class="cyan" x="220" y="64" width="30" height="12" rx="6" />

    <!-- Magenta Stripe (Upper-Mid) -->
    <path class="magenta" d="M 16,102 L 224,102 C 228,118 228,132 224,148 L 16,148 C 12,132 12,118 16,102 Z" />
    <rect class="magenta" x="-15" y="106" width="35" height="12" rx="6" />
    <rect class="magenta" x="-25" y="126" width="45" height="12" rx="6" />

    <!-- Yellow Stripe (Lower-Mid) -->
    <path class="yellow" d="M 22,160 L 220,160 C 205,195 168,220 120,220 C 85,220 52,202 34,175 C 28,170 24,165 22,160 Z" />
    <rect class="yellow" x="210" y="164" width="45" height="12" rx="6" />
    <rect class="yellow" x="200" y="184" width="35" height="12" rx="6" />

    <!-- Black Stripe / Base -->
    <path class="black" d="M 38,185 C 55,208 85,224 120,224 C 158,224 190,206 208,180 L 28,180 C 30,182 34,184 38,185 Z" />
    <rect class="black" x="0" y="180" width="35" height="12" rx="6" />
    <rect class="black" x="15" y="200" width="35" height="12" rx="6" />
  </g>

  <!-- Typography "GRUPO + DIGITAL" -->
  <g class="black" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900">
    <text x="270" y="100" font-size="82" letter-spacing="-1">GRUPO</text>
    <path d="M 270,125 H 325 V 145 H 270 V 175 H 245 V 145 H 215 V 125 H 245 V 95 H 270 Z" class="black" />
    <text x="330" y="175" font-size="82" letter-spacing="-1">DIGITAL</text>
  </g>
</svg>
